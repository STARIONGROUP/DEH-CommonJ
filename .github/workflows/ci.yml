name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B -DskipTests -Dgpg.skip=true package --file pom.xml

    - name: Test
      uses: GabrielBB/xvfb-action@v1
      with:
        run: mvn -B -Daspectj.tests.verbose=false -Dgpg.skip=true verify --file pom.xml

    - name: Set up JDK 17 for scan
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: |
          ${{ runner.os }}-sonar

    - name: Cache Maven packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Build and analyze
      uses: actions/cache@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

          xvfb-run bash -c '
            set -o pipefail

            mvn clean verify -Dgpg.skip=true sonar:sonar \
              -Dsonar.projectKey=STARIONGROUP_DEH-CommonJ \
              -Dsonar.java.source=1.8 2>&1 | tee mvn_output.log || {
                echo ""
                echo "⚠️ Sonar scan failed — showing last 40 lines of Maven output:"
                echo "------------------------------------------------------------"
                tail -n 40 mvn_output.log
                echo "------------------------------------------------------------"
                exit 0
              }
          '